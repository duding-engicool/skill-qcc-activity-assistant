        font_size: 16
        items:
          - "活动成果: {{achievements}}"
          - "遗留问题: {{remaining_issues}}"
          - "未来计划: {{future_plan}}"
    images: []
    speaker_notes_outline: "总结活动成果和未来计划"
    est_seconds: 90

  # 第14章: 致谢
  - page_no: 26
    title: "致谢"
    layout: acknowledgement
    blocks:
      - type: paragraph
        font_size: 18
        content: "感谢各位评委的聆听与指导！"
    images: []
    speaker_notes_outline: "致谢结束"
    est_seconds: 15
